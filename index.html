‏<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATE GIFT</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #292929, #090909 65%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 460px;
  text-align: center;
  padding: 40px 24px;
  border: 1px solid #444;
  border-radius: 24px;
  background: linear-gradient(145deg, #171717, #080808);
  box-shadow: 0 0 45px #000;
}

.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 5px;
}

.logo span {
  color: #aaa;
}

.subtitle {
  color: #888;
  font-size: 12px;
  letter-spacing: 4px;
  margin-top: 7px;
}

.icon {
  font-size: 65px;
  margin: 40px 0 20px;
}

h1 {
  font-size: 27px;
  margin-bottom: 15px;
}

.description {
  color: #999;
  font-size: 14px;
  line-height: 2;
}

.status {
  display: inline-block;
  margin-top: 25px;
  padding: 10px 22px;
  border: 1px solid #555;
  border-radius: 30px;
  color: #aaa;
  font-size: 13px;
}

/* زر سيرفر ديسكورد */

.discord {
  display: block;
  margin-top: 20px;
  padding: 15px;
  border: 1px solid #555;
  border-radius: 30px;
  background: linear-gradient(145deg, #292929, #111);
  color: white;
  text-decoration: none;
  font-size: 15px;
  font-weight: bold;
  transition: 0.3s;
}

.discord:hover {
  background: #444;
  box-shadow: 0 0 20px #777;
  transform: translateY(-2px);
}

.footer {
  color: #555;
  font-size: 11px;
  margin-top: 35px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">DATE <span>GIFT</span></div>
  <div class="subtitle">SPECIAL GIFT EVENT</div>

  <div class="icon">🔒</div>

  <h1>انتهى الرابط</h1>

  <p class="description">
    نعتذر منك انتهت مدة المشاركة في الفعالية
    <br>
    شكراً لكل من شارك معنا ❤️
  </p>

  <div class="status">
    انتهت الفعالية
  </div>

  <a class="discord" href="https://discord.gg/6aa" target="_blank">
    🚀 دخول سيرفر DATE
  </a>

  <div class="footer">
    DATE GIFT © 2026
  </div>

</div>

</body>
</html>
